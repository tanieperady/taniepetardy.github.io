<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sklep</title>
<style>
body {
  background: #000;
  color: #fff;
  font-family: sans-serif;
  padding: 40px;
  position: relative;
}
.total-counter-box {
  position: absolute;
  top: 40px;
  right: 40px;
  border: 3px solid #fff;
  padding: 15px 25px;
}
.total-counter-text {
  color: #0f0;
  font-size: 20px;
  font-weight: bold;
  margin: 0;
}
.products-container {
  display: flex;
  gap: 20px;
  margin-top: 80px;
}
.product-card {
  border: 3px solid #b2bec3;
  padding: 20px;
  width: 180px;
  text-align: center;
  background: #050505;
}
.product-title {
  color: #ff4757;
  font-size: 18px;
  font-weight: bold;
  margin: 0 0 10px 0;
}
.product-price {
  color: #ff4757;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 15px;
}
.counter-section {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #1e1e1e;
  padding: 8px;
  border-radius: 4px;
}
.qty-input {
  width: 50px;
  background: #000;
  color: #fff;
  border: 1px solid #ff4757;
  padding: 5px;
  text-align: center;
  font-weight: bold;
}

/* Sekcja kontaktowa i płatności na dole */
.blik-container {
  margin-top: 40px;
  max-width: 410px;
  border: 2px dashed #747d8c;
  padding: 20px;
  background: #0a0a0f;
  border-radius: 6px;
}
.blik-logo {
  font-size: 24px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: -1px;
  margin-bottom: 10px;
}
.b-1 { color: #eb3b5a; }
.b-2 { color: #fa8231; }
.b-3 { color: #f7b731; }
.b-4 { color: #20bf6b; }

.blik-phone {
  font-size: 22px;
  font-weight: bold;
  color: #0f0;
  letter-spacing: 1px;
  margin: 5px 0 15px 0;
}

.email-box {
  border-top: 1px solid #333;
  padding-top: 15px;
  margin-top: 15px;
}
.email-text {
  font-size: 16px;
  font-weight: bold;
  color: #ff4757;
  margin-bottom: 15px;
}

/* Przycisk uruchamiający wysyłkę aplikacją */
.btn-email {
  display: inline-block;
  background-color: #ff4757;
  color: white;
  padding: 12px 20px;
  text-decoration: none;
  font-weight: bold;
  border-radius: 4px;
  font-size: 14px;
  text-align: center;
  display: block;
  transition: background 0.2s;
  cursor: pointer;
}
.btn-email:hover {
  background-color: #ff6b81;
}
</style>
</head>
<body>

<!-- ZIELONY LICZNIK CEN -->
<div class="total-counter-box">
  <p class="total-counter-text">
    licznik cen : <span id="grand-total">0</span> zł
  </p>
</div>

<!-- KAFELKI Z PRODUKTAMI -->
<div class="products-container">

  <!-- MAŁE WYPIERDKI -->
  <div class="product-card">
    <div class="product-title">małe wypierdki</div>
    <div class="product-price">20zł</div>
    <div class="counter-section">
      <span style="font-size:13px;color:#aaa">Sztuk:</span>
      <input type="number" id="qty-wypierdki" class="qty-input" value="0" min="0" oninput="A()">
    </div>
  </div>

  <!-- ACHTUNG -->
  <div class="product-card">
    <div class="product-title">achtung</div>
    <div class="product-price">25zł</div>
    <div class="counter-section">
      <span style="font-size:13px;color:#aaa">Sztuk:</span>
      <input type="number" id="qty-achtung" class="qty-input" value="0" min="0" oninput="A()">
    </div>
  </div>

</div>

<!-- SEKCJA PŁATNOŚCI I KONTAKTU -->
<div class="blik-container">
  <div class="blik-logo">
    <span class="b-1">B</span><span class="b-2">L</span><span class="b-3">I</span><span class="b-4">K</span>
  </div>
  <div style="font-size: 14px; color: #a4b0be;">Przelew na telefon BLIK:</div>
  <div class="blik-phone">+48 123 456 789</div>
  
  <div style="font-size: 12px; color: #747d8c; margin-bottom: 15px;">
    W tytule wpisz swoje <strong>Imię</strong> oraz dopisek <strong>"Petardy"</strong>.
  </div>

  <!-- SEKCJA URUCHAMIANIA APLIKACJI -->
  <div class="email-box">
    <div style="font-size: 14px; color: #a4b0be; margin-bottom: 5px;">Wyślij zamówienie na:</div>
    <!-- Zmieniony wyświetlany adres -->
    <div class="email-text">tanieperady@gmail.com</div>
    
    <a onclick="wyslijMaila()" id="email-link" class="btn-email">Wyślij zamówienie aplikacją</a>
  </div>
</div>

<script>
function A() {
  const w = parseInt(document.getElementById('qty-wypierdki').value) || 0;
  const a = parseInt(document.getElementById('qty-achtung').value) || 0;
  const suma = (w * 20) + (a * 25);
  
  document.getElementById('grand-total').innerText = suma;
}

function wyslijMaila() {
  const w = parseInt(document.getElementById('qty-wypierdki').value) || 0;
  const a = parseInt(document.getElementById('qty-achtung').value) || 0;
  const suma = (w * 20) + (a * 25);

  // Zmieniony adres wysyłki w skrypcie
  const mójEmail = "tanieperady@gmail.com";
  const temat = encodeURIComponent("Zamówienie na petardy");
  const treść = encodeURIComponent(`Siemanko!\n\nChcę zamówić następujące petardy:\n- małe wypierdki: ${w} op.\n- achtung: ${a} op.\n\nRazem do zapłaty: ${suma} zł.\n\nKasa leci BLIKiem!`);
  
  window.location.href = `mailto:${mójEmail}?subject=${temat}&body=${treść}`;
}

A();
</script>

</body>
</html>
